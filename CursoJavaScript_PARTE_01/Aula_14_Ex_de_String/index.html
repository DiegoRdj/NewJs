<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex aula 13</title>
</head>
<body>
    
    <script>
        const nome = prompt("Digite seu nome: ")
        document.body.innerHTML = `O seu nome é: ${nome} <br>`
        document.body.innerHTML += `O seu nome tem ${nome.length} letras <br>`
        document.body.innerHTML += `A segunda letra do seu nome é: ${nome.charAt(1)} <br>`
        document.body.innerHTML += `Qual o primeiro indicie da letra O no seu nome? ${nome.indexOf("o")+ 1}<br>`
        document.body.innerHTML += `Qual o ultimo indicie da letra O no seu nome? ${nome.lastIndexOf("k")+ 1}<br>`
        document.body.innerHTML += `As ultimas 3 letras do seu nome é: ${nome.slice(-3)}<br>`
        document.body.innerHTML += `As palavras do seu nome sao: ${nome.split("")}<br>`
        document.body.innerHTML += `Seu nome com letras maisculas: ${nome.toUpperCase()}<br>`
        document.body.innerHTML += `Seu nome com letras minusculas: ${nome.toLowerCase()} <br>`

    </script>
</body>
</html>
